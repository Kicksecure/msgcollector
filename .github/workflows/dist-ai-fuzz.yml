## AI-Assisted

## FIXME: Breaks our existing conventions with reusables vs local workflows.
## Either rename with a "local-" prefix or create a proper reusable in
## developer-meta-files.

## Runs msgcollector's dist-ai FUZZ suite (msgcollector-tests-fuzz, which lives
## in org-ai-assisted/dist-ai, not in-tree) on each PR and on push to master.
## This is NOT the managed consumer-dist-ai-tests.yml template: msgcollector has
## only a fuzz suite, so it gates the --fuzz category rather than --core. The
## component is derived from the repo name by the reusable.
##
## Reusable docs:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/.github/workflows/reusable-dist-ai-tests.yml

name: dist-ai fuzz

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist-ai-fuzz:
    uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-dist-ai-tests.yml@master
    with:
      categories: '--fuzz'
