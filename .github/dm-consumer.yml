## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. python3-pyqt5 is needed by the dist-ai msgcollector-tests
## SafeTextBrowser validator (offscreen Qt); hypothesis by the property tests.
coverity:
  ## scan.coverity.com project name (org-ai-assisted-owned; the "/" is
  ## rejected in manual registration so the name is slash-free).
  project-name:    "org-ai-assisted-msgcollector"
  canonical-repos: "org-ai-assisted/msgcollector"

dist-ai-tests:
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt5"
